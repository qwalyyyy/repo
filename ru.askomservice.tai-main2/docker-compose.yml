version: '3'

services:
  app:
    build: .     # Путь к Dockerfile приложения (измени, если Dockerfile в другом месте)
    env_file:
      - .env
    ports:
      - "3000:3000"  # Проброс порта Next.js приложения
    depends_on:
      - posthog
    restart: unless-stopped

  posthog:
    image: posthog/posthog:latest
    env_file:
      - .env.posthog
    ports:
      - "8000:8000"
    depends_on:
      - posthog_postgres
      - posthog_redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_health"]
      interval: 10s
      timeout: 5s
      retries: 3

  posthog_postgres:
    image: postgres:12
    env_file:
      - .env.posthog
    volumes:
      - posthog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog"]
      interval: 5s
      timeout: 5s
      retries: 5

  posthog_redis:
    image: redis:latest
    volumes:
      - posthog_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  posthog_postgres_data:
  posthog_redis_data:
